<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#115e59"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed background so maskable crops never show gaps. -->
  <rect width="512" height="512" fill="url(#g)"/>
  <!-- Content kept inside the central ~70% safe zone. -->
  <text x="256" y="320" font-size="210" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif">♪</text>
</svg>
